name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    # Old glibc on purpose: the embedded Linux worker must run on older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc zip

      - name: Build Linux worker (embedded into the binary)
        run: make worker-linux

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make linux VERSION="$VERSION"
          mkdir -p out/steam-card-xmk-linux-x86_64
          cp dist/steam-card-xmk out/steam-card-xmk-linux-x86_64/
          cp LICENSE out/steam-card-xmk-linux-x86_64/
          tar -czf steam-card-xmk-linux-x86_64.tar.gz -C out steam-card-xmk-linux-x86_64

      - name: Build Windows exe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make windows VERSION="$VERSION"
          cp dist/steam-card-xmk.exe steam-card-xmk.exe
          zip -j steam-card-xmk-windows-x86_64.zip dist/steam-card-xmk.exe

      - name: Prepare Arch PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SUM=$(sha256sum steam-card-xmk-linux-x86_64.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^sha256sums=.*/sha256sums=('${SUM}')/" packaging/arch/PKGBUILD > PKGBUILD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            steam-card-xmk.exe
            steam-card-xmk-windows-x86_64.zip
            steam-card-xmk-linux-x86_64.tar.gz
            PKGBUILD
          generate_release_notes: true
